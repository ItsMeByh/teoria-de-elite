<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teoria de Elite</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .welcome-box {
            width: 100%;
            max-width: 720px;
            text-align: center;
        }

        .tag {
            font-size: 13px;
            letter-spacing: 5px;
            color: #888;
            margin-bottom: 35px;
        }

        h1 {
            font-size: clamp(52px, 8vw, 100px);
            line-height: 0.95;
            letter-spacing: -5px;
            margin-bottom: 45px;
        }

        h1 span {
            display: block;
            color: #777;
        }

        .question {
            font-size: 17px;
            color: #aaa;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            height: 65px;
            background: #101010;
            border: 1px solid #444;
            color: #fff;
            padding: 0 20px;
            font-size: 17px;
            outline: none;
            margin-bottom: 15px;
        }

        input:focus {
            border-color: #888;
        }

        input::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            height: 65px;
            border: none;
            background: #ffffff;
            color: #080808;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #cccccc;
        }

        .error {
            margin-top: 15px;
            color: #999;
            font-size: 14px;
            display: none;
        }

        .footer {
            position: fixed;
            bottom: 25px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #444;
            font-size: 12px;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 52px;
                letter-spacing: -3px;
            }

            .tag {
                font-size: 11px;
                letter-spacing: 3px;
            }

        }

    </style>
</head>


<body>

    <main class="welcome">

        <div class="welcome-box">

            <p class="tag">
                TEORIA DE ELITE
            </p>

            <h1>
                Sua jornada musical
                <span>começa aqui.</span>
            </h1>

            <p class="question">
                Como podemos chamar você?
            </p>

            <input
                type="text"
                id="userName"
                placeholder="Digite seu nome"
                maxlength="30"
            >

            <button onclick="startJourney()">
                COMEÇAR →
            </button>

            <p class="error" id="error">
                Digite seu nome para continuar.
            </p>

        </div>

    </main>


    <div class="footer">
        TEORIA DE ELITE © 2026
    </div>


    <script>

        function startJourney() {

            const name = document.getElementById("userName").value.trim();

            if (name === "") {

                document.getElementById("error").style.display = "block";

                return;
            }

            localStorage.setItem("userName", name);

            window.location.href = "curso.html";
        }

    </script>

</body>

</html>
