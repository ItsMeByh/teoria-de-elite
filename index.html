<!DOCTYPE html>
<html lang="pt-BR">
<head>
<link rel="stylesheet" href="css/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teoria de Elite</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050505;
    color:#fff;
    font-family:Arial, Helvetica, sans-serif;
}

a{
    text-decoration:none;
    color:inherit;
}

header{
    border-bottom:1px solid #202020;
    background:#050505;
}

.header{
    max-width:1200px;
    margin:auto;
    padding:24px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:15px;
    font-weight:bold;
    letter-spacing:5px;
}

nav{
    display:flex;
    gap:28px;
}

nav a{
    color:#777;
    font-size:13px;
    transition:.3s;
}

nav a:hover{
    color:#fff;
}

main{
    min-height:calc(100vh - 75px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 25px;
}

.content{
    width:100%;
    max-width:900px;
}

.small{
    color:#666;
    font-size:12px;
    letter-spacing:6px;
    margin-bottom:28px;
}

h1{
    font-size:clamp(55px,10vw,110px);
    line-height:.88;
    letter-spacing:-5px;
    margin-bottom:35px;
}

h1 span{
    color:#555;
}

.description{
    color:#888;
    font-size:18px;
    max-width:600px;
    margin-bottom:45px;
}

.name-area{
    max-width:500px;
}

label{
    display:block;
    color:#777;
    font-size:12px;
    letter-spacing:3px;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:20px;
    background:#0c0c0c;
    border:1px solid #292929;
    color:#fff;
    font-size:16px;
    outline:none;
    transition:.3s;
}

input:focus{
    border-color:#777;
}

input::placeholder{
    color:#555;
}

button{
    margin-top:15px;
    width:100%;
    padding:20px;
    background:#fff;
    color:#000;
    border:none;
    font-weight:bold;
    font-size:12px;
    letter-spacing:3px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#ddd;
}

.message{
    margin-top:20px;
    color:#777;
    font-size:13px;
    display:none;
}

footer{
    position:fixed;
    bottom:20px;
    left:0;
    width:100%;
    text-align:center;
    color:#333;
    font-size:10px;
    letter-spacing:3px;
}

@media(max-width:700px){

    .header{
        padding:20px 18px;
    }

    .logo{
        font-size:12px;
        letter-spacing:3px;
    }

    nav{
        gap:12px;
    }

    nav a{
        font-size:10px;
    }

    main{
        align-items:flex-start;
        padding-top:70px;
    }

    h1{
        font-size:60px;
        letter-spacing:-3px;
    }

    .description{
        font-size:16px;
    }

    footer{
        display:none;
    }

}

</style>
</head>

<body>

<header>

<div class="header">

<a href="index.html" class="logo">
TEORIA DE ELITE
</a>

<nav>

<a href="index.html">Início</a>

<a href="curso.html">Curso</a>

<a href="materiais.html">Materiais</a>

<a href="sobre.html">Sobre</a>

</nav>

</div>

</header>


<main>

<div class="content">

<div class="small">
TEORIA DE ELITE
</div>

<h1>
Sua jornada<br>
musical <span>começa aqui.</span>
</h1>

<p class="description">
Aprenda os fundamentos da música, desenvolva sua percepção
e evolua através de uma jornada estruturada de aprendizado.
</p>


<div class="name-area">

<label for="nome">
COMO PODEMOS CHAMAR VOCÊ?
</label>

<input
    type="text"
    id="nome"
    placeholder="Digite seu nome"
    autocomplete="off"
>

<button onclick="comecar()">
COMEÇAR →
</button>

<div class="message" id="message">
Nome salvo. Preparando sua jornada...
</div>

</div>

</div>

</main>


<footer>
APRENDA · PRATIQUE · EVOLUA
</footer>


<script>

function comecar(){

    const campo = document.getElementById("nome");

    const nome = campo.value.trim();

    if(nome === ""){

        campo.focus();

        return;

    }

    localStorage.setItem("userName", nome);

    document.getElementById("message").style.display = "block";

    setTimeout(function(){

        window.location.href = "curso.html";

    }, 500);

}

document.getElementById("nome").addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        comecar();

    }

});

</script>

</body>
</html>
