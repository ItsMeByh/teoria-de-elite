<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Teoria de Elite | O Curso</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family: Arial, Helvetica, sans-serif;

    background: #050505;

    color: white;

    overflow: hidden;
}


/* =================================
   TELA PRINCIPAL
================================= */

.entrada {

    position: relative;

    width: 100%;
    height: 100vh;
    height: 100dvh;

    display: flex;

    align-items: center;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 80% 50%,
            #292929 0%,
            #151515 25%,
            #090909 55%,
            #020202 100%
        );
}


/* =================================
   LUZ
================================= */

.luz {

    position: absolute;

    width: 650px;
    height: 650px;

    right: -180px;
    top: 50%;

    transform: translateY(-50%);

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,0.16),
            rgba(255,255,255,0.04) 35%,
            transparent 70%
        );

    filter: blur(20px);

    pointer-events: none;
}


/* =================================
   CONTEÚDO
================================= */

.conteudo {

    position: relative;

    z-index: 2;

    width: min(1050px, 88%);

    margin: auto;

    animation: aparecer 1.2s ease forwards;
}


.marca {

    color: #888;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 7px;

    margin-bottom: 25px;
}


.linha {

    width: 55px;

    height: 1px;

    background: #555;

    margin-bottom: 30px;
}


h1 {

    max-width: 950px;

    font-size: clamp(50px, 8vw, 105px);

    line-height: 0.88;

    letter-spacing: -6px;

    font-weight: 800;
}


h1 span {

    display: block;

    color: #666;
}


.descricao {

    margin-top: 35px;

    margin-bottom: 40px;

    color: #888;

    font-size: 15px;

    line-height: 1.8;
}


/* =================================
   BOTÃO
================================= */

.botao {

    display: inline-flex;

    align-items: center;

    gap: 25px;

    padding: 18px 25px;

    border: 1px solid #555;

    background: white;

    color: black;

    text-decoration: none;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 2px;

    transition: 0.3s;
}


.botao span {

    font-size: 18px;
}


.botao:hover {

    transform: translateX(8px);

    background: #ccc;
}


/* =================================
   RODAPÉ
================================= */

.rodape {

    position: absolute;

    left: 6%;
    right: 6%;

    bottom: 25px;

    display: flex;

    justify-content: space-between;

    color: #555;

    font-size: 8px;

    font-weight: bold;

    letter-spacing: 3px;
}


/* =================================
   ANIMAÇÃO
================================= */

@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(35px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

    }

}


/* =================================
   CELULAR
================================= */

@media (max-width: 700px) {

    .conteudo {

        width: calc(100% - 42px);

    }

    .marca {

        font-size: 9px;

        letter-spacing: 5px;

    }

    h1 {

        font-size: 52px;

        letter-spacing: -4px;

        line-height: 0.92;

    }

    .descricao {

        font-size: 13px;

    }

    .luz {

        width: 450px;

        height: 450px;

        right: -230px;

    }

    .rodape {

        left: 21px;

        right: 21px;

        font-size: 7px;

        letter-spacing: 2px;

    }

}

</style>

</head>


<body>

<div class="entrada">

    <div class="luz"></div>


    <main class="conteudo">

        <div class="marca">
            TEORIA DE ELITE
        </div>


        <div class="linha"></div>


        <h1>

            MAIS QUE UM CURSO.

            <span>
                UMA JORNADA.
            </span>

        </h1>


        <p class="descricao">

            Aprenda a linguagem da música.<br>

            Construa sua base. Evolua.

        </p>


        <a
            class="botao"
            href="curso.html"
        >

            COMEÇAR O CURSO

            <span>→</span>

        </a>

    </main>


    <div class="rodape">

        <span>
            TEORIA DE ELITE
        </span>

        <span>
            ROLE PARA DESCOBRIR
        </span>

    </div>

</div>

</body>

</html>
