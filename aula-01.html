<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aula 01 | Teoria de Elite</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            background: #070707;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            line-height: 1.6;

            overflow-x: hidden;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button {
            font-family: inherit;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            position: sticky;
            top: 0;

            z-index: 100;

            min-height: 76px;

            padding: 0 7%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(7,7,7,0.9);

            border-bottom: 1px solid #202020;

            backdrop-filter: blur(18px);
        }


        .logo {

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;
        }


        nav {

            display: flex;

            gap: 28px;
        }


        nav a {

            color: #666;

            font-size: 12px;

            transition: 0.3s;
        }


        nav a:hover,
        nav a.active {

            color: #fff;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: min(1050px, 88%);

            margin: auto;
        }


        /* =========================
           HERO
        ========================= */

        .lesson-hero {

            padding: 90px 0 70px;

            border-bottom: 1px solid #1c1c1c;
        }


        .tag {

            color: #666;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 20px;
        }


        .lesson-hero h1 {

            max-width: 850px;

            font-size:
                clamp(48px, 8vw, 90px);

            line-height: 0.95;

            letter-spacing: -5px;

            margin-bottom: 30px;
        }


        .lesson-hero h1 span {

            color: #666;
        }


        .lesson-intro {

            max-width: 650px;

            color: #777;

            font-size: 16px;

            line-height: 1.8;
        }


        /* =========================
           LESSON INFO
        ========================= */

        .lesson-info {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            border-bottom: 1px solid #202020;
        }


        .info-card {

            padding: 25px;

            border-right: 1px solid #202020;
        }


        .info-card:last-child {

            border-right: none;
        }


        .info-label {

            color: #555;

            font-size: 9px;

            letter-spacing: 3px;

            margin-bottom: 7px;
        }


        .info-value {

            font-size: 15px;

            font-weight: bold;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {

            padding: 80px 0;
        }


        .section-label {

            color: #555;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 15px;
        }


        .content h2 {

            font-size:
                clamp(34px, 5vw, 55px);

            line-height: 1;

            letter-spacing: -3px;

            margin-bottom: 25px;
        }


        .content-intro {

            max-width: 700px;

            color: #777;

            margin-bottom: 45px;
        }


        /* =========================
           CONCEITOS
        ========================= */

        .concepts {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 15px;
        }


        .
