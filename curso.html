<!DOCTYPE html>
<html lang="pt-BR">

<head>
<link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Curso | Teoria de Elite</title>


    <style>

        /* =====================================
           RESET
        ===================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            background: #070707;
            color: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            overflow-x: hidden;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        button {
            font-family: inherit;
        }


        /* =====================================
           FUNDO
        ===================================== */

        body::before {

            content: "";

            position: fixed;

            width: 600px;
            height: 600px;

            top: -300px;
            right: -250px;

            background: #202020;

            filter: blur(140px);

            opacity: 0.35;

            pointer-events: none;

            z-index: -1;
        }


        /* =====================================
           HEADER
        ===================================== */

        header {

            position: sticky;

            top: 0;

            z-index: 100;

            height: 76px;

            padding: 0 7%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background: rgba(7,7,7,0.88);

            border-bottom: 1px solid #202020;

            backdrop-filter: blur(18px);
        }


        .logo {

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 3px;
        }


        nav {

            display: flex;

            align-items: center;

            gap: 28px;
        }


        nav a {

            color: #777;

            font-size: 12px;

            transition: 0.3s;
        }


        nav a:hover,
        nav a.active {

            color: #ffffff;
        }


        /* =====================================
           CONTAINER
        ===================================== */

        .container {

            width: min(1200px, 86%);

            margin: auto;
        }


        /* =====================================
           HERO
        ===================================== */

        .hero {

            padding: 90px 0 60px;

            position: relative;
        }


        .hero-grid {

            display: grid;

            grid-template-columns:
                1.3fr
                0.7fr;

            gap: 30px;

            align-items: stretch;
        }


        .hero-content {

            padding: 20px 0;
        }


        .eyebrow {

            color: #666;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 18px;
        }


        .hero h1 {

            font-size:
                clamp(52px, 8vw, 100px);

            line-height: 0.9;

            letter-spacing: -6px;

            margin-bottom: 25px;
        }


        .hero h1 span {

            color: #666;
        }


        .greeting {

            color: #888;

            font-size: 16px;

            line-height: 1.7;
        }


        .greeting strong {

            color: #fff;
        }


        /* =====================================
           LEVEL CARD
        ===================================== */

        .level-card {

            position: relative;

            padding: 32px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            min-height: 260px;

            background:

                radial-gradient(
                    circle at 100% 0%,
                    #292929,
                    #111 45%,
                    #0b0b0b 75%
                );

            border: 1px solid #292929;

            overflow: hidden;
        }


        .level-card::after {

            content: "TEORIA";

            position: absolute;

            right: -15px;
            bottom: -35px;

            font-size: 100px;

            font-weight: bold;

            color: rgba(255,255,255,0.025);

            pointer-events: none;
        }


        .level-top {

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .level-label {

            color: #666;

            font-size: 10px;

            letter-spacing: 3px;
        }


        .level-number {

            font-size: 50px;

            font-weight: bold;

            letter-spacing: -3px;
        }


        .level-name {

            color: #aaa;

            font-size: 14px;

            margin-top: 5px;
        }


        .level-bottom {

            position: relative;

            z-index: 2;
        }


        .level-progress {

            height: 5px;

            width: 100%;

            background: #242424;

            margin-bottom: 12px;
        }


        .level-progress span {

            display: block;

            width: 32%;

            height: 100%;

            background: #fff;
        }


        .level-info {

            display: flex;

            justify-content: space-between;

            color: #666;

            font-size: 10px;

            letter-spacing: 1px;
        }


        /* =====================================
           STATS
        ===================================== */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            margin-top: 35px;

            border-top: 1px solid #242424;

            border-bottom: 1px solid #242424;
        }


        .stat {

            padding: 28px;

            border-right: 1px solid #242424;
        }


        .stat:last-child {

            border-right: none;
        }


        .stat-value {

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 5px;
        }


        .stat-label {

            color: #555;

            font-size: 10px;

            letter-spacing: 2px;
        }


        /* =====================================
           CONTINUE
        ===================================== */

        .continue-section {

            padding: 70px 0;

            border-top: 1px solid #1b1b1b;
        }


        .section-label {

            color: #555;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 4px;

            margin-bottom: 18px;
        }


        .continue-card {

            position: relative;

            display: grid;

            grid-template-columns:
                100px
                1fr
                auto;

            align-items: center;

            gap: 30px;

            padding: 38px;

            background: #111;

            border: 1px solid #303030;

            transition: 0.35s;

            overflow: hidden;
        }


        .continue-card:hover {

            border-color: #666;

            transform: translateY(-4px);
        }


        .continue-number {

            font-size: 48px;

            font-weight: bold;

            color: #292929;

            letter-spacing: -3px;
        }


        .continue-tag {

            color: #777;

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 8px;
        }


        .continue-card h2 {

            font-size: 30px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }


        .continue-card p {

            color: #666;

            font-size: 13px;
        }


        .continue-button {

            padding: 16px 25px;

            background: #fff;

            color: #000;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 2px;

            transition: 0.3s;
        }


        .continue-button:hover {

            background: #ccc;

            transform: translateX(4px);
        }


        /* =====================================
           TRILHA
        ===================================== */

        .path-section {

            padding: 70px 0 110px;
        }


        .path-header {

            display: flex;

            justify-content: space-between;

            align-items: end;

            margin-bottom: 45px;
        }


        .path-header h2 {

            font-size:
                clamp(40px, 6vw, 70px);

            line-height: 0.95;

            letter-spacing: -4px;
        }


        .path-header p {

            max-width: 350px;

            color: #666;

            font-size: 13px;

            text-align: right;
        }


        /* =====================================
           MODULE CARDS
        ===================================== */

        .modules {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;
        }


        .module {

            position: relative;

            min-height: 280px;

            padding: 32px;

            border: 1px solid #252525;

            background: #0d0d0d;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            transition: 0.35s;

            overflow: hidden;
        }


        .module:hover {

            transform: translateY(-5px);

            border-color: #555;
        }


        .module.current {

            background:

                radial-gradient(
                    circle at 100% 0%,
                    #252525,
                    #101010 55%
                );

            border-color: #444;
        }


        .module.locked {

            opacity: 0.48;
        }


        .module.locked:hover {

            transform: none;

            border-color: #252525;
        }


        .module-top {

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .module-number {

            color: #555;

            font-size: 11px;

            letter-spacing: 3px;
        }


        .module-status {

            padding: 7px 10px;

            border: 1px solid #292929;

            color: #777;

            font-size: 9px;

            letter-spacing: 1px;
        }


        .module.current .module-status {

            color: #fff;

            border-color: #555;
        }


        .module-icon {

            font-size: 35px;

            margin-bottom: 20px;
        }


        .module h3 {

            font-size: 27px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }


        .module p {

            max-width: 400px;

            color: #666;

            font-size: 13px;

            line-height: 1.7;
        }


        .module-bottom {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding-top: 25px;

            margin-top: 25px;

            border-top: 1px solid #202020;
        }


        .module-lessons {

            color: #555;

            font-size: 10px;

            letter-spacing: 1px;
        }


        .module-arrow {

            color: #666;

            font-size: 20px;
        }


        /* =====================================
           MINI PATH
        ===================================== */

        .path-line {

            display: flex;

            align-items: center;

            margin: 45px 0;

        }


        .path-dot {

            width: 14px;

            height: 14px;

            border-radius: 50%;

            border: 2px solid #444;

            background: #080808;

            flex-shrink: 0;
        }


        .path-dot.active {

            background: #fff;

            border-color: #fff;

            box-shadow:
                0 0 0 6px #222;
        }


        .path-connector {

            flex: 1;

            height: 1px;

            background: #292929;
        }


        /* =====================================
           ACHIEVEMENT
        ===================================== */

        .achievement {

            margin-top: 20px;

            padding: 35px;

            display: grid;

            grid-template-columns:
                80px
                1fr
                auto;

            align-items: center;

            gap: 25px;

            background: #0d0d0d;

            border: 1px solid #222;
        }


        .achievement-icon {

            width: 60px;

            height: 60px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid #333;

            font-size: 25px;
        }


        .achievement-label {

            color: #555;

            font-size: 9px;

            letter-spacing: 3px;

            margin-bottom: 5px;
        }


        .achievement h3 {

            font-size: 19px;

            margin-bottom: 3px;
        }


        .achievement p {

            color: #666;

            font-size: 12px;
        }


        .achievement-xp {

            color: #888;

            font-size: 11px;

            letter-spacing: 1px;
        }


        /* =====================================
           QUICK ACCESS
        ===================================== */

        .quick {

            padding: 80px 0;

            border-top: 1px solid #1b1b1b;
        }


        .quick-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;
        }


        .quick-card {

            padding: 28px;

            background: #0d0d0d;

            border: 1px solid #222;

            transition: 0.3s;
        }


        .quick-card:hover {

            border-color: #555;

            transform: translateY(-3px);
        }


        .quick-card span {

            display: block;

            color: #555;

            font-size: 10px;

            letter-spacing: 3px;

            margin-bottom: 15px;
        }


        .quick-card h3 {

            font-size: 22px;

            margin-bottom: 7px;
        }


        .quick-card p {

            color: #666;

            font-size: 12px;
        }


        /* =====================================
           FOOTER
        ===================================== */

        footer {

            padding: 35px 7%;

            display: flex;

            justify-content: space-between;

            border-top: 1px solid #1b1b1b;

            color: #444;

            font-size: 10px;

            letter-spacing: 1px;
        }


        /* =====================================
           ANIMAÇÕES
        ===================================== */

        .animate {

            opacity: 0;

            transform: translateY(20px);

            animation:
                appear 0.7s ease forwards;
        }


        .delay-1 {
            animation-delay: 0.1s;
        }


        .delay-2 {
            animation-delay: 0.2s;
        }


        .delay-3 {
            animation-delay: 0.3s;
        }


        @keyframes appear {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================
           CELULAR
        ===================================== */

        @media (max-width: 800px) {

            header {

                height: auto;

                min-height: 70px;

                padding: 18px 20px;

                gap: 20px;
            }


            nav {

                gap: 13px;
            }


            nav a {

                font-size: 10px;
            }


            .container {

                width: calc(100% - 40px);
            }


            .hero {

                padding: 65px 0 45px;
            }


            .hero-grid {

                grid-template-columns: 1fr;

            }


            .hero h1 {

                font-size: 62px;

                letter-spacing: -4px;
            }


            .level-card {

                min-height: 220px;
            }


            .stats {

                grid-template-columns: 1fr;
            }


            .stat {

                border-right: none;

                border-bottom: 1px solid #242424;
            }


            .stat:last-child {

                border-bottom: none;
            }


            .continue-section,
            .path-section,
            .quick {

                padding: 60px 0;
            }


            .continue-card {

                grid-template-columns:
                    55px
                    1fr;

                padding: 25px;

                gap: 18px;
            }


            .continue-number {

                font-size: 32px;
            }


            .continue-button {

                grid-column: 1 / -1;

                text-align: center;
            }


            .path-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 20px;
            }


            .path-header p {

                text-align: left;
            }


            .modules {

                grid-template-columns: 1fr;
            }


            .module {

                min-height: 250px;

                padding: 25px;
            }


            .achievement {

                grid-template-columns:
                    60px
                    1fr;

                padding: 25px;
            }


            .achievement-xp {

                grid-column: 2;
            }


            .quick-grid {

                grid-template-columns: 1fr;
            }


            footer {

                padding: 30px 20px;

                flex-direction: column;

                gap: 10px;
            }

        }

    </style>

</head>


<body>

    <div class="cinematic-intro" id="cinematicIntro">
    <div class="intro-content">
        <div class="intro-small">TEORIA DE ELITE</div>

        <h1>
            MAIS QUE UM CURSO.
            <br>
            <span>UMA JORNADA.</span>
        </h1>

        <p>
            Aprenda a linguagem da música.
            <br>
            Construa sua base. Evolua.
        </p>

        <button onclick="enterCourse()">
            COMEÇAR O CURSO →
        </button>
    </div>
</div>
<!-- =====================================
     HEADER
===================================== -->

<header>

    <div class="logo">
        TEORIA DE ELITE
    </div>


    <nav>

        <a href="index.html">
            Início
        </a>

        <a
            href="curso.html"
            class="active"
        >
            Curso
        </a>

        <a href="materiais.html">
            Materiais
        </a>

        <a href="#">
            Sobre
        </a>

    </nav>

</header>



<!-- =====================================
     HERO
===================================== -->

<section class="hero">

    <div class="container">

        <div class="hero-grid">


            <div class="hero-content animate">

                <div class="eyebrow">
                    SUA JORNADA MUSICAL
                </div>


                <h1>

                    Aprenda.
                    <br>

                    Pratique.
                    <br>

                    <span>Evolua.</span>

                </h1>


                <p class="greeting">

                    Bem-vindo,
                    <strong id="studentName">
                        estudante
                    </strong>.

                    <br>

                    Continue sua jornada e domine
                    a linguagem da música.

                </p>

            </div>



            <div class="level-card animate delay-1">

                <div class="level-top">

                    <div>

                        <div class="level-label">
                            SEU NÍVEL
<script>
function enterCourse() {
    const intro = document.getElementById("cinematicIntro");

    intro.style.opacity = "0";
    intro.style.transition = "opacity 0.8s ease";

    setTimeout(() => {
        intro.style.display = "none";
    }, 800);
}
</script>
